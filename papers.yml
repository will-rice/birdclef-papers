repository:
  name: "BirdCLEF Papers"
  slug: "birdclef-papers"
  description: "Papers relevant to the BirdCLEF bird sound identification competitions"
# Ported from the legacy scripts/fetch_papers.py: every source queried the last
# 8 days, and each source kept its own keyword queries.
adapters:
  # The 58 legacy title/abstract phrase queries, OR-ed into one request. The
  # ti:/abs: form exceeds the arXiv API query-length limit, so each phrase uses
  # all:; the topic gate below still requires a legacy keyword in the title or
  # abstract.
  - name: arxiv
    enabled: true
    secret_env: null
    lookback_days: 8
    page_size: 200
    max_pages: 10
    max_results: 2000
    backfill_start: 1991-08-01
    backfill_days: 365
    filters:
      search_query: 'all:"BirdCLEF" OR all:"bird sound recognition" OR all:"bird call recognition" OR all:"bird song recognition" OR all:"bird species identification audio" OR all:"bird vocalization classification" OR all:"avian sound classification" OR all:"bioacoustics deep learning" OR all:"passive acoustic monitoring birds" OR all:"soundscape bird" OR all:"bird audio detection" OR all:"bird species classification spectrogram" OR all:"ecoacoustics machine learning" OR all:"bird call detection" OR all:"LifeCLEF bird" OR all:"BirdNET" OR all:"xeno-canto" OR all:"avian bioacoustics" OR all:"bird acoustic identification" OR all:"automated bird identification" OR all:"bird sound classification deep learning" OR all:"bird species acoustic" OR all:"soundscape ecology machine learning" OR all:"wildlife acoustic monitoring" OR all:"ornithology deep learning" OR all:"bird audio neural network" OR all:"avian call classification" OR all:"bird sound event detection" OR all:"bird sound dataset" OR all:"PAM birds" OR all:"bird species recognition neural" OR all:"mel spectrogram bird classification" OR all:"bird call transfer learning" OR all:"bioacoustics transfer learning" OR all:"bird sound self-supervised" OR all:"bird sound contrastive learning" OR all:"bird call few-shot" OR all:"bioacoustics few-shot learning" OR all:"bird species weakly supervised" OR all:"bird call pseudo label" OR all:"bird sound domain adaptation" OR all:"bird call transformer" OR all:"bird audio multi-label classification" OR all:"Perch bioacoustics" OR all:"BirdSet dataset" OR all:"AudioMoth bird" OR all:"bird sound EfficientNet" OR all:"bioacoustic foundation model" OR all:"bird vocalization deep learning" OR all:"avian species recognition deep learning" OR all:"bird vocalization recognition" OR all:"nocturnal flight call detection" OR all:"bird species audio benchmark" OR all:"soundscape species identification" OR all:"biodiversity acoustic monitoring deep learning" OR all:"bird sound separation" OR all:"bird call identification neural" OR all:"avian sound detection"'
  # The 12 legacy bulk-search queries, OR-ed. Disabled: the adapter uses
  # relevance search, which has no boolean syntax, so one query cannot express
  # the legacy union, and unauthenticated requests hit HTTP 429, which fails
  # the run. No SEMANTIC_SCHOLAR_API_KEY secret is known to exist.
  - name: semantic_scholar
    enabled: false
    secret_env: null
    lookback_days: 8
    page_size: 100
    max_pages: 10
    max_results: 1000
    filters:
      query: '(BirdCLEF) | (bird sound recognition) | (bird vocalization classification) | (avian bioacoustics deep learning) | (passive acoustic monitoring birds) | (LifeCLEF bird) | (BirdNET bird identification) | (bird call classification neural network) | (bird species audio identification) | (soundscape ecology bird machine learning) | (ecoacoustics bird deep learning) | (automated bird species recognition)'
  # Legacy CEUR-WS LifeCLEF/BirdCLEF working-notes search. Disabled: the dblp
  # API currently answers with a bot-check HTML page, which fails the run.
  - name: dblp
    enabled: false
    secret_env: null
    lookback_days: 8
    page_size: 100
    max_pages: 5
    max_results: 500
    filters:
      query: "BirdCLEF|LifeCLEF"
  # Legacy bioRxiv preprints. Disabled: this provider lists every bioRxiv
  # preprint in the window with no keyword query, and the permissive legacy
  # keyword gate would accept most of them.
  - name: biorxiv_crossref
    enabled: false
    secret_env: null
    lookback_days: 8
    page_size: 100
    max_pages: 100
    max_results: 10000
    filters:
      provider: biorxiv
# Legacy relevance rule: reject any NEGATIVE_KEYWORDS match, then require at
