<svg id="A1.p2.pic1" class="ltx_picture" height="635.68" overflow="visible" version="1.1" viewbox="0 0 346.5 635.68" width="346.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,635.68) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.67 L 0 630.02 C 0 633.15 2.54 635.68 5.67 635.68 L 340.84 635.68 C 343.97 635.68 346.5 633.15 346.5 630.02 L 346.5 5.67 C 346.5 2.54 343.97 0 340.84 0 L 5.67 0 C 2.54 0 0 2.54 0 5.67 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.73 5.67 L 1.73 612.05 L 344.77 612.05 L 344.77 5.67 C 344.77 3.49 343.01 1.73 340.84 1.73 L 5.67 1.73 C 3.49 1.73 1.73 3.49 1.73 5.67 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.43 620.41)"><foreignobject style="--ltx-fo-width:22.88em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="316.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
