<span id="A1.p2.pic1.1.1" class="ltx_p"><span id="A1.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Overview Supplementary Material</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.43 580.52)"><foreignobject style="--ltx-fo-width:22.88em;--ltx-fo-height:1.79em;--ltx-fo-depth:41.49em;font-size:10pt;" height="599" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="316.59"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:22.88em;">
<span id="A1.I1" class="ltx_enumerate" style="--ltx-enum-leftmargin:0.45cm;">
<span id="A1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i1.p1.1" class="ltx_p"><span id="A1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We have uploaded our large-scale </span><span id="A1.I1.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">dataset collection</span><span id="A1.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A1.I1.i1.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet<span id="footnote3" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">3</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">3</sup>
                                                  <span class="ltx_tag ltx_tag_note"><span id="footnote3.1" class="ltx_text ltx_font_serif" style="--ltx-fg-color:#000000;">3</span></span>
                                                  
                                                  
                                                  
                                                
<span id="footnote3.6" class="ltx_inline-block ltx_transformed_outer" style="width:274.1pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-15.2pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote3.6.1" class="ltx_p"><a href="https://huggingface.co/datasets/DBD-research-group/BirdSet" title class="ltx_ref ltx_url" style="--ltx-fg-color:#000000;">https://huggingface.co/datasets/DBD-research-group/BirdSet</a></span>
</span></span></span></span></span></span><span id="A1.I1.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><cite class="ltx_cite ltx_citemacro_citep"><span id="A1.I1.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib72" title class="ltx_ref">Rauch et al., 2024b</a><span id="A1.I1.i1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="A1.I1.i1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> to Hugging Face Datasets and provide an extensive  </span><span id="A1.I1.i1.p1.1.10" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">code repository<span id="footnote4" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">4</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">4</sup>
                                                  <span class="ltx_tag ltx_tag_note"><span id="footnote4.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">4</span></span>
                                                  
                                                  
                                                  
                                                
<span id="footnote4.6" class="ltx_inline-block ltx_transformed_outer" style="width:212.6pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-11.8pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote4.6.1" class="ltx_p"><a href="https://github.com/DBD-research-group/BirdSet" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://github.com/DBD-research-group/BirdSet</a></span>
</span></span></span></span></span></span><span id="A1.I1.i1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">, which includes the training and evaluation protocols, is available on GitHub. We also provide a </span><span id="A1.I1.i1.p1.1.12" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">leaderboard<span id="footnote5" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">5</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">5</sup>
                                                  <span class="ltx_tag ltx_tag_note"><span id="footnote5.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">5</span></span>
                                                  
                                                  
                                                  
                                                
<span id="footnote5.6" class="ltx_inline-block ltx_transformed_outer" style="width:321.3pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-17.9pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote5.6.1" class="ltx_p"><a href="https://huggingface.co/spaces/DBD-research-group/BirdSet-Leaderboard" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://huggingface.co/spaces/DBD-research-group/BirdSet-Leaderboard</a></span>
</span></span></span></span></span></span><span id="A1.I1.i1.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> on Hugging Face to promote comparability and encourage participation in our benchmark.</span></span>
</span></span>
<span id="A1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i2.p1.1" class="ltx_p"><span id="A1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">To promote transparency and reproducibility, we have made all our </span><span id="A1.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">experimental results<span id="footnote6" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">6</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">6</sup>
                                                  <span class="ltx_tag ltx_tag_note"><span id="footnote6.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">6</span></span>
                                                  
                                                  
                                                  
                                                
<span id="footnote6.6" class="ltx_inline-block ltx_transformed_outer" style="width:189.0pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-10.5pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote6.6.1" class="ltx_p"><a href="https://wandb.ai/deepbirddetect/birdset/" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://wandb.ai/deepbirddetect/birdset/</a></span>
</span></span></span></span></span></span><span id="A1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> available through Weights&amp;Biases </span><cite class="ltx_cite ltx_citemacro_citep"><span id="A1.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib8" title class="ltx_ref">Biewald, 2020</a><span id="A1.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="A1.I1.i2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A1.I1.i3.p1.1" class="ltx_p"><span id="A1.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We provide access to our </span><span id="A1.I1.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">trained models<span id="footnote7" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">7</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">7</sup>
                                                  <span class="ltx_tag ltx_tag_note"><span id="footnote7.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">7</span></span>
                                                  
                                                  
                                                  
                                                
<span id="footnote7.6" class="ltx_inline-block ltx_transformed_outer" style="width:193.7pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-10.8pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote7.6.1" class="ltx_p"><a href="https://huggingface.co/DBD-research-group" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://huggingface.co/DBD-research-group</a></span>
</span></span></span></span></span></span><span id="A1.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> through Hugging Face Models </span><cite class="ltx_cite ltx_citemacro_citep"><span id="A1.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib90" title class="ltx_ref">Wolf et al., 2020</a><span id="A1.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="A1.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, allowing others to reproduce our results without the need to train from scratch. By doing so, we offer trainable baseline models to facilitate further experimentation and development.</span></span>
</span></span>
<span id="A1.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I1.i4.p1" class="ltx_para">
<span id="A1.I1.i4.p1.1" class="ltx_p"><span id="A1.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We provide a </span><span id="A1.I1.i4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">croissant</span><span id="A1.I1.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><cite class="ltx_cite ltx_citemacro_citep"><span id="A1.I1.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib2" title class="ltx_ref">Akhtar et al., 2024</a><span id="A1.I1.i4.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="A1.I1.i4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> metadata file in our code repository.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>