<svg id="S1.p4.pic1" class="ltx_picture" height="897.51" overflow="visible" version="1.1" viewbox="0 0 550 897.51" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,897.51) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.67 L 0 891.84 C 0 894.97 2.54 897.51 5.67 897.51 L 544.33 897.51 C 547.46 897.51 550 894.97 550 891.84 L 550 5.67 C 550 2.54 547.46 0 544.33 0 L 5.67 0 C 2.54 0 0 2.54 0 5.67 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.73 5.67 L 1.73 861.12 L 548.27 861.12 L 548.27 5.67 C 548.27 3.49 546.51 1.73 544.33 1.73 L 5.67 1.73 C 3.49 1.73 1.73 3.49 1.73 5.67 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.43 866.78)"><foreignobject style="--ltx-fo-width:37.59em;--ltx-fo-height:1.81em;--ltx-fo-depth:0em;font-size:10pt;" height="25.06" overflow="visible" transform="matrix(1 0 0 -1 0 25.06)" width="520.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.59em;">
<span id="S1.p4.pic1.1.1" class="ltx_p"><span id="S1.p4.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FFFFFF;">BirdSet<span id="S1.p4.pic1.1.1.1.1" class="ltx_text ltx_font_serif">: Outline and Contributions</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.43 829.58)"><foreignobject style="--ltx-fo-width:37.59em;--ltx-fo-height:1.79em;--ltx-fo-depth:59.5em;font-size:10pt;" height="848.06" overflow="visible" transform="matrix(1 0 0 -1 0 24.83)" width="520.14"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.59em;">
<span id="S1.I1" class="ltx_enumerate" style="--ltx-enum-leftmargin:0.43cm;">
<span id="S1.I1.ix1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(1)</span> 
<span id="S1.I1.ix1.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.ix1.p1.1" class="ltx_p"><span id="S1.I1.ix1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We introduce the </span><span id="S1.I1.ix1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S1.I1.ix1.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">dataset collection<span id="footnote1" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">1</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">1</sup>
                                <span class="ltx_tag ltx_tag_note"><span id="footnote1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">1</span></span>
                                
                                
                                
                              
<span id="footnote1.6" class="ltx_inline-block ltx_transformed_outer" style="width:274.1pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-15.2pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote1.6.1" class="ltx_p"><a href="https://huggingface.co/datasets/DBD-research-group/BirdSet" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://huggingface.co/datasets/DBD-research-group/BirdSet</a></span>
</span></span></span></span></span></span><span id="S1.I1.ix1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> on Hugging Face (HF) </span><cite class="ltx_cite ltx_citemacro_citep"><span id="S1.I1.ix1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><a href="#bib.bib54" title class="ltx_ref">Lhoest et al., 2021</a><span id="S1.I1.ix1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">)</span></cite><span id="S1.I1.ix1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">, featuring about 520,000 unique global bird sound recordings from nearly 10,000 species with over 6,800 hours for training and over 400 hours of </span><span title="passive acoustic monitoring" class="ltx_glossaryref" style="--ltx-fg-color:#000000;">PAM</span><span id="S1.I1.ix1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> recordings with 170,000 annotated vocalizations across eight unique project sites for evaluation.</span></span>
</span></span>
<span id="S1.I1.ix2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(2)</span> 
<span id="S1.I1.ix2.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.ix2.p1.1" class="ltx_p"><span id="S1.I1.ix2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> serves as an extensive </span><span id="S1.I1.ix2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">multi-purpose dataset</span><span id="S1.I1.ix2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> in audio classification with evaluation </span><span id="S1.I1.ix2.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">use cases</span><span id="S1.I1.ix2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> such as self-supervised learning, event detection, multi-label classification under covariate and domain shifts with noisy labels or few-shot, and active learning.</span></span>
</span></span>
<span id="S1.I1.ix3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(3)</span> 
<span id="S1.I1.ix3.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.ix3.p1.1" class="ltx_p"><span id="S1.I1.ix3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">By providing a </span><span id="S1.I1.ix3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">large-scale train dataset</span><span id="S1.I1.ix3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and a </span><span id="S1.I1.ix3.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">diverse test dataset collection</span><span id="S1.I1.ix3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="S1.I1.ix3.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> represents a comprehensive and additional resource in audio classification (cf. </span><a href="#S1.F1" title="Figure 1 ‣ 1 Introduction ‣ BirdSet: A Large-Scale Dataset for Audio Classification in Avian Bioacoustics" class="ltx_ref ltx_refmacro_autoref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">Figure 1</span></a><span id="S1.I1.ix3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="S1.I1.ix4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(4)</span> 
<span id="S1.I1.ix4.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.ix4.p1.1" class="ltx_p"><span id="S1.I1.ix4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A comprehensive </span><span id="S1.I1.ix4.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">literature analysis</span><span id="S1.I1.ix4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> identifies and discusses </span><span id="S1.I1.ix4.p1.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">challenges</span><span id="S1.I1.ix4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> in computational avian bioacoustics embedded within the broader audio classification domain. We structure them to offer research guidelines and evaluation use cases resulting from </span><span id="S1.I1.ix4.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix4.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S1.I1.ix5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(5)</span> 
<span id="S1.I1.ix5.p1" class="ltx_para ltx_noindent">
<span id="S1.I1.ix5.p1.1" class="ltx_p"><span id="S1.I1.ix5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We </span><span id="S1.I1.ix5.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">benchmark</span><span id="S1.I1.ix5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> multi-label classification under covariate shift with noisy labels and task shift using well-known </span><span title="deep learning" class="ltx_glossaryref" style="--ltx-fg-color:#000000;">DL</span><span id="S1.I1.ix5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> models. Our extensive empirical study evaluates distinct supervised training scenarios, including large-scale training and fine-tuning on </span><span id="S1.I1.ix5.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix5.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="S1.I1.ix6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(6)</span> 
<span id="S1.I1.ix6.p1" class="ltx_para">
<span id="S1.I1.ix6.p1.1" class="ltx_p"><span id="S1.I1.ix6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">An extensive </span><span id="S1.I1.ix6.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">codebase<span id="footnote2" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">2</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">2</sup>
                                <span class="ltx_tag ltx_tag_note"><span id="footnote2.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">2</span></span>
                                
                                
                                
                              
<span id="footnote2.6" class="ltx_inline-block ltx_transformed_outer" style="width:212.6pt;height:8.300000000000001pt;vertical-align:-2.0pt;"><span class="ltx_transformed_inner" style="transform:translate(-11.8pt,0.5pt) scale(0.9,0.9) ;">
<span id="footnote2.6.1" class="ltx_p"><a href="https://github.com/DBD-research-group/BirdSet" title class="ltx_ref ltx_url ltx_font_typewriter ltx_font_medium" style="--ltx-fg-color:#000000;">https://github.com/DBD-research-group/BirdSet</a></span>
</span></span></span></span></span></span><span id="S1.I1.ix6.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> with standardized training and evaluation protocols enables reproducing our results, supporting </span><span id="S1.I1.ix6.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">BirdSet</span><span id="S1.I1.ix6.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">’s utility, and easing accessibility for newcomers.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>