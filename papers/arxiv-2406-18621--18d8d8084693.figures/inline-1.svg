<span id="S1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.49em;">
<span id="S1.I1" class="ltx_enumerate">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S1.I1.i1.p1" class="ltx_para">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We introduce deep active learning (AL) to avian bioacoustics, highlighting challenges and proposing a practical framework.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S1.I1.i2.p1" class="ltx_para">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We conduct an initial feasibility study based on the dataset collection </span><span id="S1.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Birdset</span><span id="S1.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><cite class="ltx_cite ltx_citemacro_cite"><a href="#bib.bib6" title class="ltx_ref">Rauch et al. (2024)</a></cite><span id="S1.I1.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, showcasing the benefits of deep AL. Additionally, we release the dataset and code.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>