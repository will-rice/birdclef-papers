<svg id="S2.SS4.p2.pic1" class="ltx_picture" height="156.09" overflow="visible" version="1.1" viewbox="0 0 550 156.09" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,156.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 150.18 C 0 153.45 2.64 156.09 5.91 156.09 L 544.09 156.09 C 547.36 156.09 550 153.45 550 150.18 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 150.18 C 1.97 152.36 3.73 154.12 5.91 154.12 L 544.09 154.12 C 546.27 154.12 548.03 152.36 548.03 150.18 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:36.62em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="506.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S2.SS4.p2.pic1.1.1" class="ltx_p"><span id="S2.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Our approach:<span id="S2.SS4.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> We plan to evaluate the effectiveness of DAL for bird sound recognition, focusing on augmenting model adaptability and curtailing labeling expenses. Recognizing the potential benefits, our primary interest pivots around the interplay between DAL and high-quality representations derived from SSL, thereby offering a more efficient and flexible adaptation to diverse real-world tasks. Through this integrative approach, anchored by our proposed benchmark suite, we aim to pave the way for more efficient, adaptable, and cost-effective methods in bioacoustics.</span></span></span>
</span></span></span></foreignobject></g></g></svg>