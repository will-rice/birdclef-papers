<span id="S2.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<span id="S2.SS3.p2.pic1.1.1" class="ltx_p"><span id="S2.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Our approach:<span id="S2.SS3.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> We propose to rigorously investigate the application of SSL with transformer models on raw audio data with the objective of learning high-quality bird sound representations in our proposed benchmark suite. Guided by the principles underpinning successful speech recognition models such as Wav2Vec2, our research is set to harness extensive unlabeled datasets. Moreover, we seek to publish a foundation model <span id="S2.SS3.p2.pic1.1.1.1.1.1" class="ltx_text ltx_font_typewriter">Bird2Vec</span> as a versatile tool that can be employed for multiple downstream tasks, propelling advancements in this research domain.</span></span></span>
</span></span></span></foreignobject></g></g></svg>